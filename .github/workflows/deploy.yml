name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        # The cloud settings come from .env.production; repository secrets of the same name override
        # them. An unset secret is an empty string, which would blank the file's values, so only
        # non-empty ones are exported.
        run: |
          if [ -n "$SECRET_SUPABASE_URL" ] && [ -n "$SECRET_SUPABASE_ANON_KEY" ]; then
            export VITE_SUPABASE_URL="$SECRET_SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$SECRET_SUPABASE_ANON_KEY"
          elif [ -n "$SECRET_SUPABASE_URL$SECRET_SUPABASE_ANON_KEY" ]; then
            # one without the other would pair one project's URL with another project's key
            echo "::error::Set both VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY secrets, or neither."
            exit 1
          fi
          npm run build
        env:
          # The site's real path: "/<repo>" for project pages, "" for <user>.github.io or a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SECRET_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SECRET_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
