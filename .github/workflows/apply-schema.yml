# Applies supabase/schema.sql to the live database through the Supabase Management API, run by hand from the
# Actions tab. The file is written to be re-run safely. Needs the SUPABASE_ACCESS_TOKEN secret with database
# access. Prints only the API's status, never data.
name: Apply database schema

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-schema
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sqshacllpzozxqpetwyo
    steps:
      - uses: actions/checkout@v4
      - name: Apply supabase/schema.sql
        run: |
          jq -n --rawfile q supabase/schema.sql '{query: $q}' > body.json
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @body.json)
          echo "HTTP $code"
          if [ "$code" -ge 300 ]; then jq -c '{message: (.message // .error // "error")}' out.json || true; exit 1; fi
          echo "schema applied"
