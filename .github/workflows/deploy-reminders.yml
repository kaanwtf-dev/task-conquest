# Deploys the "reminders" Supabase Edge Function whenever code it is built from changes on main, and on demand
# from the Actions tab (Run workflow). Needs one repository secret, SUPABASE_ACCESS_TOKEN: a Supabase access
# token (Supabase › Account › Access Tokens). Without it the job does nothing. See docs/REMINDERS_SETUP.md.
name: Deploy reminders function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/reminders/**'
      - 'src/**'
      - 'scripts/build-reminders.mjs'
      - 'package-lock.json'
      - '.github/workflows/deploy-reminders.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-reminders
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sqshacllpzozxqpetwyo
    steps:
      - name: Check for the Supabase access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::No SUPABASE_ACCESS_TOKEN secret yet, so nothing was deployed (docs/REMINDERS_SETUP.md, step 2)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: npm ci

      - name: Check the function before it goes out
        if: steps.token.outputs.ok == 'true'
        run: |
          npx tsc -p supabase/functions/reminders
          npx vitest run src/push

      - name: Build the single-file function
        if: steps.token.outputs.ok == 'true'
        run: |
          npm run build:reminders
          # deployed from a folder of its own: only this function, never any project settings
          mkdir -p deploy/supabase/functions/reminders
          cp dist-functions/reminders.ts deploy/supabase/functions/reminders/index.ts
          printf 'project_id = "task-conquest"\n\n[functions.reminders]\nverify_jwt = true\n' > deploy/supabase/config.toml

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        working-directory: deploy
        run: supabase functions deploy reminders --project-ref "$PROJECT_REF" --use-api
